# ============================================================================
# マイナビ
#
# URL に卒業年が入る（マイナビ2028 なら /28/）。年度は直接書かず、
# config.yaml の settings.grad_year から {grad_yy} に埋められる。
# 卒業年が違う人に渡しても、この定義を書き換える必要はない。
#
# 状態: ログイン方法まで確認済み。一覧ページの締切パターンは未調整（enabled: false）
#
# なぜ login.mode が manual なのか
# --------------------------------
# マイナビのログインは My CareerID（mcid.mynavi.jp）に飛ぶ。新しいブラウザから
# ログインすると、メールに届く6桁の確認コードを要求される。毎回まっさらな
# Chromium を起動する自動ログインでは、この確認コードで必ず止まる。
# そこで1回だけ手でログインし、その状態を保存して使い回す:
#
#     python main.py --login mynavi
#
# 使い始めるまでの手順
# --------------------
#   0. config.yaml の settings.grad_year に卒業予定年を入れる（例: 2028）
#   1. python main.py --login mynavi         ブラウザが開くので手でログイン
#   2. python tools/inspect_site.py mynavi --grep 締切
#      → inspect_mynavi.txt に表示テキストが行番号つきで出る
#   3. 締切を示す行の形と、企業名が何行前に出るかを見て、下の deadline /
#      company を調整する
#   4. python main.py --site mynavi --dry-run で確認できたら enabled: true
#
# 別のページを見たいときは URL を直接指定できる:
#     python tools/inspect_site.py mynavi --url "https://job.mynavi.jp/28/pc/user/displayMypageMenu/index"
# ============================================================================

name: "マイナビ"
enabled: false          # 一覧ページの調整が済んでから true にする

# manual 方式なのでメールアドレス・パスワードは使わない（.env への追記も不要）
credentials: {}

login:
  mode: manual
  # ここを開くと My CareerID のログイン画面へ転送される（2026-09 時点で確認済み）
  url: "https://job.mynavi.jp/{grad_yy}/pc/common/displayRelayScreen/displayForLogin"
  success_check:
    # セッションが切れると、マイページを開いても ID 基盤に飛ばされる。
    # 遷移先の URL にこの文字列が含まれていたらログアウト扱いにする
    url_not_contains: "mcid.mynavi.jp"

listings:
  # マイページの「スケジュール」。エントリー締切や説明会の予定が並ぶ想定
  - url: "https://job.mynavi.jp/{grad_yy}/pc/user/displaySchedule/index"
    wait_ms: 4000
    title_prefix: "【マイナビ】"

    deadline:
      # まずはキーワード方式で広めに拾い、inspect_site.py の結果を見て
      # match: regex に切り替えるとノイズが減る
      # 例: value: '(エントリー)?締切[:：]?\s*\d{1,2}月\d{1,2}日'
      match: keyword
      keywords: ["締切", "締め切り", "〆切", "エントリー期限", "応募期限", "受付終了日"]
      date_from: same_line
      context_before: 3
      context_after: 3

    skip_if_context_contains: ["受付終了", "終了しました", "エントリー済"]

    company:
      lookback: 8
      min_length: 4
      skip_exact:
        ["マイページ", "マイページトップ", "スケジュール", "企業検索", "メッセージ",
         "エントリー", "お知らせ", "設定", "ログアウト", "検索", "もっと見る",
         "詳細を見る", "前の月", "次の月", "今日"]
      skip_patterns:
        - '^\d{4}卒$'
        - '^\d{1,2}月$'
        - '^(月|火|水|木|金|土|日)$'
        - '^(オンライン|対面|WEB)$'

  # 予約リスト（説明会・セミナーの申込一覧）。不要なら丸ごと削ってよい
  - url: "https://job.mynavi.jp/{grad_yy}/pc/search/bookmark_list/entry_reserve_all.html"
    wait_ms: 4000
    title_prefix: "【マイナビ】"
    deadline:
      match: keyword
      keywords: ["締切", "締め切り", "〆切", "エントリー期限", "応募期限"]
      date_from: same_line
      context_before: 3
      context_after: 3
    skip_if_context_contains: ["受付終了", "終了しました"]
    company:
      lookback: 8
      min_length: 4
      skip_exact: ["予約リスト", "マイページ", "検索", "もっと見る", "詳細を見る"]
      skip_patterns:
        - '^\d{4}卒$'
        - '^\d{1,2}月$'
