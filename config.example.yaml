# config.yaml のひな形。コピーして使う:
#     Windows:      copy config.example.yaml config.yaml
#     mac / Linux:  cp config.example.yaml config.yaml
#
# setup.bat を実行した場合は自動でコピー済み。
#
# 認証情報（メールアドレス・パスワード）はここには書かない。
# サイトのログイン情報は .env、Google の鍵は service_account.json に置く。

google_calendar:
  # 予定を書き込むカレンダーの ID。
  #
  # 「Google でログイン」方式なら空のままでよい（自分のメインカレンダーに入る）。
  # 別のカレンダーに入れたい場合だけ、「設定と共有」に出ているカレンダー ID を書く。
  # ※サービスアカウント方式では空や "primary" は使えない（自分の ID を必ず書く）
  calendar_id: ""

  # 「Google でログイン」用。配布物に同梱されている（触らなくてよい）
  oauth_client_file: "oauth_client.json"
  # ログインの結果が保存される場所（自動で作られる）
  token_file: "token.json"

  # サービスアカウント方式を使う場合だけ置く（上級者向け）
  service_account_file: "service_account.json"

  # 予定のタイトル先頭に付く目印。重複検出にも使うので途中で変えない
  event_tag: "[就活自動登録]"
  color_id: "11"          # 11 = Tomato（赤）
  reminder_days: [3, 1]   # 何日前に通知するか

settings:
  # 卒業予定年。マイナビのように URL に年度が入るサイトで使う
  # （サイト定義の {grad_year} / {grad_yy} に埋め込まれる）
  # 3年生・院1年なら「今の年度 + 2」。2026年度なら 2028
  grad_year: 2028

  days_ahead: 90              # 何日先までの締切を対象にするか
  headless: true              # false にするとブラウザが表示される（デバッグ用）
  debug_screenshots: false    # true で各ステップのスクショを保存
  log_file: "shukatsu.log"
  # user_agent: ""            # 必要なら上書き（既定は OS に合わせて自動選択）
